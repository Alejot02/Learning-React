<!DOCTYPE html>
<html>
  <head>
    <title>Exercises 3g</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      // 3g. Create a Display-as-you-type app. create an <input> and a <p>. As you type in the input, the text you type should also appear in the <p> with "Hello" in front of it.
      

      function App() {
        const [ inputText, setInputText ] = React.useState('');

        function saveInputText(event){
          setInputText(event.target.value);
        }

        function reset() {
          setInputText('');
        }

        function example() {
          const exampleNames = ['John Doe', 'Valerie Reid', 'Jason Smith']
          const randomIndex = Math.floor(Math.random() * 3);
          
          setInputText(exampleNames[randomIndex]);
        }

        return (
          <>
            <input onChange={saveInputText} value={inputText} placeholder="Type a name here" />
            <button onClick={reset} >Reset</button>
            <button onClick={example}>Example</button>
            <p>Hello {inputText}</p>
          </>
        );
      }  


      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
