<!DOCTYPE html>
<html>
  <head>
    <title>Exercises 3f</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      // 3f. Create a reset button that resets the count to 0 for all counters.


      function CounterButton({count, setCount}) {
        function increaseCount() {
          setCount(count + 1);
        }

        return (
          <button onClick={increaseCount} >
            {count !== 1 ? <>Clicked {count} times</> : <>Clicked {count} time</> }
          </button>
        )
      }

      function ResetButton({ setCount }){
        function reset(){
          setCount(0)
        }
        
        return (
          <button onClick={reset}>Reset</button>
        )
      }

      function App() {
        const [ count, setCount ] = React.useState(0)

        return (
          <>
            <CounterButton 
              count={count}
              setCount={setCount}
            />          
            <CounterButton 
              count={count}
              setCount={setCount}
            /> 
            <ResetButton 
              setCount={setCount}
            />         
          </>
        );
      }  


      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
