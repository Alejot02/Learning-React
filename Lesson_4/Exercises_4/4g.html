<!DOCTYPE html>
<html>
  <head>
    <title>Exercises 4g</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      // 4g. add a console.log inside set Interval and check how many times it runs, then remove the dependency array ([] from useEffect and see how many times it runs.) 

      function App() {
        const [ time, setTime ] = React.useState(dayjs().format('HH:mm:ss'))

        React.useEffect(()=>{
          setInterval(()=>{
            console.log('set time')
            setTime(dayjs().format('HH:mm:ss'))
          }, 1000)
        }, [])

        return (
          <p>Current time: {time}</p>
        )
      }

      


      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
