<!DOCTYPE html>
<html>
  <head>
    <title>Exercises 4i</title>
    <style>
      body {
        background-color: rgb(222, 222, 222);
        margin-top: 0;
        margin-bottom: 0;
      }

      .button-container {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        gap: 10px;
      }

      button {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      // 4i Style the counter.


      function App() {
        const [ count, setCount ] = React.useState(0);

        const autoClickButton = React.useRef();


        function increaseCount() {
          setCount(count + 1);
        }

        function resetButton() {
          setCount(0);
        }

        function autoClick() {
          setInterval(()=> {
            autoClickButton.current.click()
          }, 1000);
        }

        return (
          <div className="button-container">
            <button onClick={increaseCount} ref={autoClickButton}>
            Clicked {count} {count !== 1 ? <>times</> : <>time</>}
            </button>
            <button onClick={resetButton}>Reset</button>
            <button onClick={autoClick}>Auto Click</button>
          </div>
          
        );
      }  

      

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
