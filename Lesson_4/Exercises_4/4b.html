<!DOCTYPE html>
<html>
  <head>
    <title>Exercises 4b</title>
    <style>
      button {
        background-color: rgb(25, 135, 84);
        color: white;
        border: none;
        border-radius: 15px;
        padding: 15px 20px;
        min-width: 70px;

        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>
    <script type="text/babel">
      // 4b. Using React.useState(), make the button switch between on and off every time its clicked.
      


      function ButtonSwitch({ buttonText, setButtonText }) {
        function changeButtonText() {
          setButtonText(buttonText === 'ON' ? 'OFF' : 'ON')
        }

        return (
          <button onClick={changeButtonText}>{buttonText}</button>
        )
      }

      function App() {
        const [ buttonText, setButtonText ] = React.useState('ON');
        
        return (
          <>
            <ButtonSwitch 
              buttonText={buttonText}
              setButtonText={setButtonText}
            />
          </>
        )
        
      }
      

      const container = document.querySelector(".js-container");
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
